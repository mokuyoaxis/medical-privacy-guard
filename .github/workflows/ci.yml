name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Quality and package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Static security scan
        run: python -m bandit -q -r core detectors transformers medical_privacy_guard cli formats
      - name: Dependency audit
        run: python -m pip_audit
      - name: Build distributions
        run: python -m build
      - name: Isolated wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/mpg-wheel-venv
          /tmp/mpg-wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mpg-wheel-venv/bin/python - <<'PY'
          from medical_privacy_guard import Guard

          result = Guard().sanitize(
              "患者：测试患者甲，电话13800000000",
              "external_approved",
              "EXTERNAL_AI_ASSISTANCE",
          )
          assert result.sanitized_payload is not None
          assert result.verification is not None and result.verification.passed
          PY
