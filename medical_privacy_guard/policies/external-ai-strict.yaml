# Policy profile: external-ai-strict
# Version: 1
# Purpose: Default strict policy for third-party LLM / MCP / API disclosures.
# Principle: fail-closed, direct identifiers must not leave the boundary.

profile: external-ai-strict
version: "1"

rules:
  # Hard rules: never overridden by score
  hard:
    - condition:
        recipient_trust_level: [EXTERNAL_BLOCKED]
      verdict: BLOCK
      reason_code: UNTRUSTED_RECIPIENT

    - condition:
        facts_contain: [GOVERNMENT_ID]
        recipient_trust_level: [EXTERNAL_UNKNOWN, EXTERNAL_BLOCKED]
      verdict: BLOCK
      reason_code: GOVERNMENT_ID_PRESENT

    - condition:
        facts_contain: [BIOMETRIC, GENETIC]
        recipient_trust_level: [EXTERNAL_UNKNOWN, EXTERNAL_BLOCKED, EXTERNAL_APPROVED]
      verdict: BLOCK
      reason_code: BIOMETRIC_DATA_PRESENT

    - condition:
        facts_contain: [PARSER_FAILURE]
      verdict: BLOCK
      reason_code: PARSER_FAILURE

    - condition:
        facts_contain: [UNSUPPORTED_FORMAT]
      verdict: BLOCK
      reason_code: UNSUPPORTED_FORMAT

  # Identifier transformations
  identifiers:
    PHONE:
      action: REMOVE
      risk_score: 20
    EMAIL:
      action: REMOVE
      risk_score: 20
    URL:
      action: REMOVE
      risk_score: 15
    IP_ADDRESS:
      action: REMOVE
      risk_score: 15
    PERSON_NAME:
      action: TOKENIZE
      risk_score: 20
    GOVERNMENT_ID:
      action: REMOVE
      risk_score: 40
    MEDICAL_RECORD_NUMBER:
      action: REMOVE
      risk_score: 25
    EXACT_DATE:
      action: GENERALIZE
      risk_score: 15
    PRECISE_LOCATION:
      action: GENERALIZE
      risk_score: 15
    BIOMETRIC:
      action: BLOCK
      risk_score: 50
    GENETIC:
      action: BLOCK
      risk_score: 50
    # v0.2 clinical-narrative and institution types
    AGE:
      action: GENERALIZE
      risk_score: 10
    HOSPITAL_NAME:
      action: GENERALIZE
      risk_score: 20
    DEPARTMENT:
      action: GENERALIZE
      risk_score: 15
    WARD:
      action: GENERALIZE
      risk_score: 20
    BED_NUMBER:
      action: REMOVE
      risk_score: 20
    DOCTOR_NAME:
      action: TOKENIZE
      risk_score: 20
    NURSE_NAME:
      action: TOKENIZE
      risk_score: 20
    RELATIVE_NAME:
      action: TOKENIZE
      risk_score: 25
    SPECIMEN_ID:
      action: REMOVE
      risk_score: 25
    ACCESSION_NUMBER:
      action: REMOVE
      risk_score: 25
    LANDLINE:
      action: REMOVE
      risk_score: 20
    POSTAL_CODE:
      action: REMOVE
      risk_score: 20
    SOCIAL_MEDIA_ID:
      action: REMOVE
      risk_score: 25

  # Medical content risk (quasi-identifiers)
  medical:
    MEDICAL_CONTENT:
      risk_score: 10
    RARE_CONDITION:
      risk_score: 20
    # Non-transformable context signals: they contribute risk and can trigger
    # ASK, but there is no span to rewrite.
    RARE_CONTEXT:
      risk_score: 30
    SEX:
      risk_score: 5

# Recipient risk modifiers
recipient_risk:
  LOCAL: 0
  INTERNAL_TRUSTED: 0
  EXTERNAL_APPROVED: 10
  EXTERNAL_UNKNOWN: 20
  EXTERNAL_BLOCKED: 100

# Purpose modifiers
purpose_risk:
  TREATMENT: 0
  RESEARCH: 5
  EDUCATION: 5
  OPERATIONS: 0
  PUBLICATION: 10
  EXTERNAL_AI_ASSISTANCE: 15
  UNKNOWN: 30

# Engineering score reference bands. In v0.1 these calibrate/report raw-input
# risk only; they never override hard rules, recipient authorization,
# transformability, or post-transform verification.
thresholds:
  allow_max: 0
  sanitize_max: 60

# Verification
verification:
  required: true
  fail_verdict: BLOCK
