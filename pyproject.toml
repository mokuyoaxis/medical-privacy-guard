[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-privacy-guard"
version = "0.2.1"
description = "Local-first privacy guardrails for medical data before it crosses a trust boundary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "mokuyoaxis" },
]
keywords = ["privacy", "medical", "phi", "ai", "agent", "guard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/mokuyoaxis/medical-privacy-guard"
Repository = "https://github.com/mokuyoaxis/medical-privacy-guard"
Issues = "https://github.com/mokuyoaxis/medical-privacy-guard/issues"
Security = "https://github.com/mokuyoaxis/medical-privacy-guard/security/advisories/new"

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
    "bandit>=1.7",
    "build>=1.2",
    "pip-audit>=2.7",
]

[project.scripts]
medical-privacy-guard = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "detectors*", "transformers*", "policies*", "formats*", "adapters*", "cli*", "medical_privacy_guard*"]

[tool.setuptools.package-data]
policies = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests"]
